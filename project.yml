name: CouplesDoThings
options:
  bundleIdPrefix: com.couplesdothings
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  CouplesDoThings:
    type: application
    platform: iOS
    bundleId: com.couplesdothings.app
    sources:
      - path: CouplesDoThings
        excludes:
          - "**/*.md"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couplesdothings.app
        INFOPLIST_FILE: CouplesDoThings/Info.plist
        CODE_SIGN_ENTITLEMENTS: CouplesDoThings/CouplesDoThings.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couples Do Things
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: CouplesDoThingsWidget
        embed: true
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseCore
    entitlements:
      path: CouplesDoThings/CouplesDoThings.entitlements
    info:
      path: CouplesDoThings/Info.plist
      properties:
        CFBundleDisplayName: Couples Do Things
        CFBundleURLTypes:
          - CFBundleURLName: com.couplesdothings.app
            CFBundleURLSchemes:
              - couplesdothings
        NSPhotoLibraryUsageDescription: Choose a photo for your home screen widget background.
        UILaunchScreen: {}
  CouplesDoThingsWidget:
    type: app-extension
    platform: iOS
    bundleId: com.couplesdothings.app.widget
    sources:
      - path: CouplesDoThingsWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couplesdothings.app.widget
        INFOPLIST_FILE: CouplesDoThingsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CouplesDoThingsWidget/CouplesDoThingsWidget.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couples Do Things
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: YES
    entitlements:
      path: CouplesDoThingsWidget/CouplesDoThingsWidget.entitlements
    info:
      path: CouplesDoThingsWidget/Info.plist
      properties:
        CFBundleDisplayName: Couples Do Things
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  CouplesDoThings:
    build:
      targets:
        CouplesDoThings: all
        CouplesDoThingsWidget: all
    run:
      config: Debug
      executable: CouplesDoThings
